<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dwarf - Programmation</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --border: #2a2e38; --text: #e6e8ec;
    --muted: #9aa1ad; --accent: #4da3ff; --ok: #35c46a; --warn: #e0a83c; --err: #e05c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  select {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 0.95rem; min-width: 240px;
  }
  .status-row { display: flex; align-items: center; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 999px; font-size: 0.8rem; border: 1px solid var(--border);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); } .dot.muted { background: var(--muted); }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .card h2 { font-size: 0.95rem; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .empty { color: var(--muted); font-size: 0.85rem; padding: 8px 0; }
  .tag { font-size: 0.72rem; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); display: inline-block; }
  .tag.overdue { background: rgba(224,168,60,0.15); color: var(--warn); border-color: var(--warn); }
  .tag.origin-local { background: rgba(77,163,255,0.15); color: var(--accent); border-color: var(--accent); }
  .tag.origin-native { background: rgba(154,161,173,0.15); color: var(--text); border-color: var(--border); }
  .tag.state-shooting { background: rgba(77,163,255,0.15); color: var(--accent); border-color: var(--accent); }
  .tag.state-success { background: rgba(53,196,106,0.15); color: var(--ok); border-color: var(--ok); }
  .tag.state-failed, .tag.state-interrupted { background: rgba(224,92,92,0.15); color: var(--err); border-color: var(--err); }
  .capture-summary { font-size: 0.75rem; color: var(--muted); margin-top: 3px; }
  .task-line { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .task-error { color: var(--err); }
  .tag.state-warning { background: rgba(224,168,60,0.15); color: var(--warn); border-color: var(--warn); }
  .task-warning { color: var(--warn); }
  .check-shots { margin-left: 4px; }
  .check-btn { font-size: 0.72rem; padding: 1px 8px; border-radius: 6px; background: transparent; cursor: pointer; margin-left: 4px; border: 1px solid currentColor; }
  .check-btn.view { color: var(--accent); }
  .check-btn.failed { color: var(--err); }
  .check-btn.warning { color: var(--warn); }
  #checkModal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
  #checkModal.open { display: flex; }
  #checkCard { background: var(--card, #1b1f27); color: var(--text); border: 1px solid var(--border); border-radius: 10px; width: min(92vw, 480px); max-height: 90vh; overflow: auto; padding: 14px; }
  #checkCard .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
  #checkCard .head button { background: none; border: none; color: var(--accent); font-size: 1.1rem; cursor: pointer; }
  #checkCard .verdict-ok { color: var(--ok); font-weight: 600; }
  #checkCard .verdict-bad { color: var(--err); font-weight: 600; }
  #checkCard .muted { color: var(--muted); font-size: 0.85rem; }
  #checkCard img { width: 100%; border-radius: 6px; margin-top: 8px; }
  .capture-summary-inline { font-size: 0.75rem; color: var(--muted); }
  #refreshBtn {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 8px 14px; font-size: 0.85rem; cursor: pointer;
  }
  #refreshBtn:disabled { opacity: 0.5; cursor: default; }
  #showMoreBtn { margin: 10px auto 0; display: block; background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 5px 14px; cursor: pointer; }
  .error-note { color: var(--warn); font-size: 0.8rem; }
  .filter-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .filter-toggle button {
    background: var(--card); color: var(--muted); border: none; padding: 7px 12px;
    font-size: 0.82rem; cursor: pointer;
  }
  .filter-toggle button.active { background: var(--accent); color: #fff; }
  .filter-toggle button:not(:last-child) { border-right: 1px solid var(--border); }
</style>
</head>
<body>

<h1>Programmation des Dwarfs</h1>

<div class="status-row">
  <select id="deviceSelect"></select>
  <div class="filter-toggle">
    <button id="filterFutureBtn" class="active" onclick="setFilterMode('future')">Futur</button>
    <button id="filterAllBtn" onclick="setFilterMode('all')">Tous</button>
  </div>
  <button id="refreshBtn" onclick="loadPrograms()">Rafraîchir</button>
  <span id="stateBadges"></span>
</div>

<div class="card">
  <h2>Programmes (locaux + planning natif)</h2>
  <table id="programsTable">
    <thead><tr><th>Origine</th><th>Nom / Description</th><th>Début</th><th>Fin</th><th>Détail</th></tr></thead>
    <tbody></tbody>
  </table>
  <button id="showMoreBtn" style="display:none" onclick="showMore()"></button>
  <div class="empty" id="programsEmpty" style="display:none">Rien à afficher.</div>
  <div class="error-note" id="nativeError" style="display:none"></div>
  <div class="error-note" id="nativeStale" style="display:none"></div>
</div>

<script>
const NATIVE_ERROR_LABELS = {
  not_connected: "Device non connecté - planning natif indisponible.",
  device_busy: "Device occupé (session en cours) - planning natif non lu cette fois.",
  read_failed: "Échec de lecture du planning natif.",
};
const TASK_STATE_CLASS = { 1: "state-shooting", 2: "state-success", 3: "state-failed", 4: "state-interrupted" };

let devices = [];
// "Futur" (default) hides anything already in the past - a row with no
// known date/time at all (sortKey === Infinity, e.g. a native schedule
// entry whose parent schedule carries no start_time) is kept visible in
// both modes rather than hidden, since "unknown" isn't "past".
let filterMode = "future";

// "Tous" (user-requested Oct 2026): newest first, PAGE_SIZE rows at a
// time, "show more" adds PAGE_SIZE more. Back to one page on a filter /
// device change; kept on a refresh.
const PAGE_SIZE = 20;
const SHOW_MORE_TEXT = "Afficher plus ({n} restantes)";
let shownCount = PAGE_SIZE;
function showMore() {
  shownCount += PAGE_SIZE;
  renderSelected();
}

function setFilterMode(mode) {
  filterMode = mode;
  shownCount = PAGE_SIZE;
  document.getElementById("filterFutureBtn").classList.toggle("active", mode === "future");
  document.getElementById("filterAllBtn").classList.toggle("active", mode === "all");
  renderSelected();
}

// Mosaïque : valeur affichée dans l'application officielle, par axe (X × Y) :
// 1.0 = un seul cadre, 1.8 = maximum (2 panneaux sur cet axe). Accepte 1.4 ou 140.
function fmtScale(v) {
  let n = Number(v);
  if (!Number.isFinite(n) || n <= 0) return null;
  if (n > 10) n /= 100;
  return n.toFixed(1);
}

function mosaicText(h, v) {
  const a = fmtScale(h), b = fmtScale(v);
  if (!a || !b) return "Mosaïque";
  const panels = (parseFloat(a) > 1 ? 2 : 1) * (parseFloat(b) > 1 ? 2 : 1);
  return `Mosaïque ${a} × ${b}` + (panels > 1 ? ` (${panels} panels)` : "");
}

function fmtTs(sec) {
  if (!sec) return "-";
  const d = new Date(sec * 1000);
  return d.toLocaleString();
}

function fmtLocalDate(str) {
  if (!str) return "-";
  return new Date(str.replace(" ", "T")).toLocaleString();
}

function sortKeyFromEpoch(sec) {
  return sec ? sec * 1000 : Infinity;
}

function sortKeyFromLocalStr(str) {
  if (!str) return Infinity;
  const t = new Date(str.replace(" ", "T")).getTime();
  return Number.isNaN(t) ? Infinity : t;
}

function preselectedUid() {
  const parts = window.location.pathname.split("/").filter(Boolean);
  // path is /Program-<lang> or /Program-<lang>/<dwarfUid>
  return parts.length > 1 ? decodeURIComponent(parts[1]) : null;
}

async function loadDevices() {
  const res = await fetch("/api/dwarfs");
  const data = await res.json();
  devices = (data.devices || []).filter(d => !d.virtual);
  const sel = document.getElementById("deviceSelect");
  sel.innerHTML = "";
  for (const d of devices) {
    const opt = document.createElement("option");
    opt.value = d.dwarfUid;
    opt.textContent = `${d.name} (${d.model})`;
    sel.appendChild(opt);
  }
  const wanted = preselectedUid();
  if (wanted && devices.some(d => d.dwarfUid === wanted)) {
    sel.value = wanted;
  }
  sel.onchange = () => { shownCount = PAGE_SIZE; renderSelected(); };
}

function badge(text, dotClass) {
  return `<span class="badge"><span class="dot ${dotClass}"></span>${text}</span>`;
}

function renderStatus(entry) {
  const badges = [];
  badges.push(entry.connected ? badge("Connecté", "ok") : badge("Déconnecté", "muted"));
  if (entry.runningProgram) {
    badges.push(badge(`En session : ${entry.runningProgram.description || "?"}`, "warn"));
  } else if (entry.busy) {
    badges.push(badge("Occupé", "warn"));
  }
  badges.push(entry.armed ? badge("Armé", "ok") : badge("Non armé", "muted"));
  document.getElementById("stateBadges").innerHTML = badges.join(" ");
}

// View / Check (user-requested Oct 2026): what the Dwarf saved for a
// native task or a local program run - /api/task-check (task_check.py)
const CHECK_TEXT = {"view": "Voir", "check": "Vérifier", "title": "Ce que le Dwarf a enregistré : ", "loading": "Lecture de l'album du Dwarf...", "album_error": "Impossible de lire l'album du Dwarf.", "not_found": "Aucune session trouvée sur le Dwarf pour cette tâche (créneau horaire).", "ok": "Session enregistrée : l'empilement semble exploitable.", "empty": "Session trouvée, mais aucune image n'a été empilée.", "unknown": "Session trouvée, mais son shotsInfo.json n'a pas pu être lu.", "name_differs": "Trouvée par l'heure seulement : le nom de la cible diffère de celui de la tâche.", "shots": "images empilées", "integration": "intégration"};
function epochS(v) { v = Number(v); return v > 1e10 ? Math.floor(v / 1000) : v; }
function shotsText(c) {
  return c && c.stacked != null && c.taken != null ? `${c.stacked}/${c.taken} ${CHECK_TEXT.shots}` : "";
}
// cached: what an earlier View / Check found (task_check_cache.py), shown
// before the button and updated when it is opened again
function checkButton(uid, name, start, end, kind, cached) {
  if (!start || !end) return "";
  const label = kind === "view" ? CHECK_TEXT.view : CHECK_TEXT.check;
  const shots = shotsText(cached);
  return `<span class="check-shots capture-summary-inline">${shots}</span><button class="check-btn ${kind}" data-uid="${encodeURIComponent(uid)}" data-name="${encodeURIComponent(name || "")}"`
    + ` data-start="${epochS(start)}" data-end="${epochS(end)}">${label}</button>`;
}
function escText(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
async function openCheck(btn) {
  const name = decodeURIComponent(btn.dataset.name);
  document.getElementById("checkTitle").textContent = CHECK_TEXT.title + (name || "?");
  const body = document.getElementById("checkBody");
  body.innerHTML = `<div class="muted">${CHECK_TEXT.loading}</div>`;
  document.getElementById("checkModal").classList.add("open");
  let r;
  try {
    const q = new URLSearchParams({ name, start: btn.dataset.start, end: btn.dataset.end });
    const resp = await fetch(`/api/task-check/${btn.dataset.uid}?${q}`);
    r = await resp.json();
  } catch (e) { r = { status: "album_error" }; }
  if (r.status !== "ok" && r.status !== "empty" && r.status !== "unknown") {
    body.innerHTML = `<div class="verdict-bad">${r.status === "not_found" ? CHECK_TEXT.not_found : CHECK_TEXT.album_error}</div>`;
    return;
  }
  let html = `<div class="${r.status === "ok" ? "verdict-ok" : r.status === "empty" ? "verdict-bad" : "muted"}">${CHECK_TEXT[r.status]}</div>`;
  html += `<div>${escText(r.target)} · ${escText(r.date)}</div>`;
  if (!r.nameMatched) html += `<div class="task-warning" style="font-size:0.8rem">${CHECK_TEXT.name_differs}</div>`;
  const bits = [];
  if (r.stacked != null && r.taken != null) bits.push(`${r.stacked}/${r.taken} ${CHECK_TEXT.shots}`);
  if (r.integration) bits.push(`${CHECK_TEXT.integration} ${escText(r.integration)}`);
  if (bits.length) html += `<div class="muted">${bits.join(" · ")}</div>`;
  if (r.thumbnailUrl) html += `<img src="${r.thumbnailUrl}" alt="">`;
  body.innerHTML = html;
  const shotsSpan = btn.previousElementSibling;
  if (shotsSpan && shotsSpan.classList.contains("check-shots") && shotsText(r)) shotsSpan.textContent = shotsText(r);
}
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".check-btn");
  if (btn) { openCheck(btn); return; }
  if (e.target.id === "checkModal" || e.target.closest("#checkClose")) document.getElementById("checkModal").classList.remove("open");
});

function renderPrograms(entry) {
  const tbody = document.querySelector("#programsTable tbody");
  tbody.innerHTML = "";

  const rows = [];

  for (const p of (entry.localPrograms || [])) {
    let detail = "";
    if (p.status === "done") detail = '<span class="tag state-success">Terminé</span>';
    else if (p.status === "error") detail = '<span class="tag state-failed">Erreur</span>';
    else if (p.due) detail = '<span class="tag overdue">En retard</span>';
    // Once a program has actually run, its real start/end (scheduler_
    // runner.py's starting_date/processed_date) is more useful than
    // the originally scheduled date/time - falls back to the schedule
    // for anything not run yet (ToDo/).
    const startVal = p.realStart || p.scheduledAt;
    const endVal = p.realEnd || p.endAt;
    const bits = [];
    if (p.cameraType) bits.push(p.cameraType);
    if (p.exposure) bits.push(`${p.exposure}s`);
    if (p.gain) bits.push(`gain ${p.gain}`);
    // Mosaïque native Dwarf (Tele) : champs de setup_camera exposés par /api/programs
    if (p.doMosaic) {
      bits.push(mosaicText(p.framingX, p.framingY) + (p.mosaicCount ? ` · ${p.mosaicCount} images/panel` : ""));
    }
    if (p.filterName) bits.push(p.filterName);
    if (p.shotsTaken != null || p.requestedCount) {
      const stacked = p.shotsStacked != null ? `${p.shotsStacked} stackées / ` : "";
      const taken = p.shotsTaken != null ? p.shotsTaken : "?";
      const total = p.requestedCount ? ` / ${p.requestedCount} demandées` : "";
      bits.push(`${stacked}${taken} prises${total}`);
    }
    if (bits.length) detail += `<div class="capture-summary">${bits.join(" · ")}</div>`;
    if (p.checkTask) {
      detail += checkButton(entry.dwarfUid, p.checkTask.name, p.checkTask.startTime, p.checkTask.endTime,
                            p.status === "done" ? "view" : "failed", p.shotsTaken != null ? null : p.check);
    }
    rows.push({
      origin: "local",
      sortKey: sortKeyFromLocalStr(startVal),
      name: p.description || p.filename,
      start: fmtLocalDate(startVal),
      end: endVal ? fmtLocalDate(endVal) : "-",
      detail,
    });
  }

  for (const sched of (entry.nativeSchedule || [])) {
    const taskLines = (sched.tasks || []).map(t => {
      // Error -1: a warning, not a failure (native_schedule.py WARNING_ERROR_CODES)
      const warning = t.warning || t.error_code === -1;
      const cls = warning ? "state-warning" : (TASK_STATE_CLASS[t.state_code] || "");
      const bits = [];
      if (t.shutterName) bits.push(`${t.shutterName}s`);
      if (t.gainName) bits.push(`gain ${t.gainName}`);
      if (t.filterModeName) bits.push(t.filterModeName);
      // Mosaïque native : échelles horizontalScale/verticalScale de la tâche (native_schedule.py)
      if (t.isMosaic) bits.push(mosaicText(t.horizontalScale, t.verticalScale));
      // count/stacked deliberately NOT shown here (user-reported Sep
      // 2026: unreliable on the native side, unlike the local programs'
      // own shots_taken/shots_stacked) - see native_schedule.py's own
      // parsing: these come straight from the task's stored params
      // JSON, which may just reflect what was last SYNCED rather than
      // what has actually shot so far.
      const summary = bits.length ? `<span class="capture-summary-inline">${bits.join(" · ")}</span>` : "";
      // Device-recorded reason of a failed / interrupted task (native_schedule.py)
      const err = warning
        ? `<span class="capture-summary-inline task-warning">⚠ Avertissement</span>`
        : t.error_code
        ? `<span class="capture-summary-inline task-error">${t.error_code} ${t.error_name || ""}</span>`
        : "";
      const failed = !!t.error_code || t.state_code === 3 || t.state_code === 4;
      const check = (failed || t.state_code === 2)
        ? checkButton(entry.dwarfUid, t.name, t.startTime, t.endTime, !failed ? "view" : (warning ? "warning" : "failed"), t.check)
        : "";
      return `<div class="task-line"><span class="tag ${cls}">${t.name}</span>${err}${summary}${check}</div>`;
    }).join("");
    rows.push({
      origin: "native",
      sortKey: sortKeyFromEpoch(sched.startTime),
      name: sched.name,
      start: fmtTs(sched.startTime),
      end: fmtTs(sched.endTime),
      detail: taskLines || "-",
    });
  }

  const nowMs = Date.now();
  let visibleRows;
  const moreBtn = document.getElementById("showMoreBtn");
  if (filterMode === "future") {
    rows.sort((a, b) => a.sortKey - b.sortKey);
    visibleRows = rows.filter(r => r.sortKey >= nowMs);
    moreBtn.style.display = "none";
  } else {
    // Newest first (undated rows, sortKey Infinity, on top), one page at a time
    rows.sort((a, b) => b.sortKey - a.sortKey);
    visibleRows = rows.slice(0, shownCount);
    const left = rows.length - visibleRows.length;
    moreBtn.textContent = SHOW_MORE_TEXT.replace("{n}", left);
    moreBtn.style.display = left > 0 ? "block" : "none";
  }

  document.getElementById("programsEmpty").style.display = visibleRows.length ? "none" : "block";

  for (const r of visibleRows) {
    const originTag = r.origin === "local"
      ? '<span class="tag origin-local">Local</span>'
      : '<span class="tag origin-native">Natif</span>';
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${originTag}</td>
      <td>${r.name}</td>
      <td>${r.start}</td>
      <td>${r.end}</td>
      <td>${r.detail}</td>
    `;
    tbody.appendChild(tr);
  }

  const errNote = document.getElementById("nativeError");
  if (entry.nativeScheduleError) {
    errNote.textContent = NATIVE_ERROR_LABELS[entry.nativeScheduleError] || entry.nativeScheduleError;
    errNote.style.display = "block";
  } else {
    errNote.style.display = "none";
  }
  const staleNote = document.getElementById("nativeStale");
  if (entry.nativeScheduleStale) {
    const t = entry.nativeScheduleFetchedAt ? new Date(entry.nativeScheduleFetchedAt * 1000).toLocaleTimeString() : "?";
    staleNote.textContent = `Planning natif en cache (dernière lecture réussie : ${t}) - device non joignable pour un rafraîchissement.`;
    staleNote.style.display = "block";
  } else {
    staleNote.style.display = "none";
  }
}

function renderSelected() {
  const uid = document.getElementById("deviceSelect").value;
  const entry = window.__programsByUid ? window.__programsByUid[uid] : null;
  if (!entry) return;
  renderStatus(entry);
  renderPrograms(entry);
}

async function loadPrograms() {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  try {
    const res = await fetch("/api/programs");
    const data = await res.json();
    window.__programsByUid = {};
    for (const e of (data.devices || [])) {
      window.__programsByUid[e.dwarfUid] = e;
    }
    renderSelected();
  } finally {
    btn.disabled = false;
  }
}

(async function init() {
  await loadDevices();
  await loadPrograms();
})();
</script>

<div id="checkModal"><div id="checkCard">
  <div class="head"><span id="checkTitle"></span><button id="checkClose" aria-label="close">&#x2715;</button></div>
  <div id="checkBody"></div>
</div></div>
</body>
</html>
