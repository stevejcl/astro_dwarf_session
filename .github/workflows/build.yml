name: Build Astro Dwarf UI

on:
  push:
    branches:
      - NiceGui_V3_multi
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 📦 Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-local.txt --target .
          pip install pyinstaller

      - name: Install Pillow for icon conversion
        if: runner.os == 'macOS'
        run: python -m pip install Pillow

      - name: ⚙️ Run build script
        run: |
          python buildAstroDwarfUI.py

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: zip-${{ github.ref_name }}-${{ runner.os }}
          path: AstroDwarfUI-${{ runner.os }}.zip


  release:
    name: 🚀 Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v5

      - name: 🏷️ Get base version from CHANGELOG.md
        id: version
        run: |
          VERSION=$(grep -m 1 -o '\[.*\]' CHANGELOG.md | sed 's/\[\(.*\)\]/\1/')
          echo "BASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🧪 Compute final version (beta or stable)
        run: |
          VERSION=${{ env.BASE_VERSION }}

          if [ "${{ github.ref_name }}" ] != "NiceGui_V3_multi" ]; then
            RUN=${{ github.run_number }}
            VERSION="${VERSION}-beta.${RUN}"
          fi

          echo "FINAL_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 📥 Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: downloads

      - name: 🚀 Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: downloads/**/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          skipIfReleaseExists: true
          tag: v${{ env.FINAL_VERSION }}
          name: Release v${{ env.FINAL_VERSION }}
